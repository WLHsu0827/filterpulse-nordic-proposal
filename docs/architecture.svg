<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">FilterPulse proposed hardware and existing software boundary</title>
  <desc id="desc">A low-voltage guarded fan bench supplies differential pressure, tachometer RPM, temperature, humidity and ambient pressure to a proposed nRF54LM20 DK. The DK would compute validity, learned clean reference, residual EWMA and an inspection recommendation, then send a Bluetooth notification. The current implementation is local JavaScript replay and host C inference/encoding, not connected firmware.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#386b57" stroke-width="1.5"/></marker></defs>
  <rect width="1100" height="470" fill="#f4f6f0"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#163c37">
    <text x="30" y="40" font-size="22" font-weight="700">Proposed bench and Bluetooth path - NOT WIRED OR FLASHED</text>
    <rect x="30" y="75" width="270" height="185" rx="10" fill="#fff" stroke="#8aaa9a"/>
    <text x="50" y="108" font-size="18" font-weight="700">Guarded low-voltage fan rig</text>
    <text x="50" y="142" font-size="15">Filter pressure taps: SDP31</text>
    <text x="50" y="174" font-size="15">Fan tach: level-safe timer input</text>
    <text x="50" y="206" font-size="15">Temperature / RH / pressure:</text>
    <text x="50" y="232" font-size="15">BME280 (all parts proposed)</text>
    <rect x="400" y="75" width="300" height="185" rx="10" fill="#e4efe2" stroke="#8aaa9a"/>
    <text x="420" y="108" font-size="18" font-weight="700">nRF54LM20 DK (not obtained)</text>
    <text x="420" y="143" font-size="15">Validity and calibrated envelope</text>
    <text x="420" y="174" font-size="15">Learned baseline / residual EWMA</text>
    <text x="420" y="206" font-size="15">Inspect filter AND airflow path</text>
    <text x="420" y="232" font-size="15">CPU-first; no NPU assumption</text>
    <rect x="810" y="75" width="255" height="185" rx="10" fill="#fff" stroke="#8aaa9a"/>
    <text x="830" y="108" font-size="18" font-weight="700">Bluetooth maintenance view</text>
    <text x="830" y="143" font-size="15">Read + subscribe to status</text>
    <text x="830" y="174" font-size="15">Invalid / stale data visible</text>
    <text x="830" y="206" font-size="15">No cloud service required</text>
    <text x="830" y="232" font-size="15">Radio path not yet implemented</text>
    <path d="M310 167 H390 M710 167 H800" fill="none" stroke="#386b57" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="325" y="150" font-size="13">I2C / GPIO</text>
    <text x="723" y="150" font-size="13">BLE LE</text>
    <rect x="30" y="310" width="1035" height="125" rx="10" fill="#fff1ca" stroke="#c5ad76"/>
    <text x="50" y="346" font-size="19" font-weight="700">Implemented now: single-thread local software, not device firmware</text>
    <text x="50" y="379" font-size="16">Original seeded simulation / CSV + JSON replay / group-separated fit, tune, holdout / comparison / UI</text>
    <text x="50" y="407" font-size="16">ECMAScript + host C inference / 20-byte codec. No DK execution, measured current, RF or energy saving.</text>
  </g>
</svg>
